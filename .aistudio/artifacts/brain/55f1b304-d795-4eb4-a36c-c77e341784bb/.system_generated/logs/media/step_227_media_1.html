<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit × Jaymart UI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0C1A4B; --navy2:#1E2E66; --blue:#2E5BBA; --orange:#F58220; --orange-d:#B84E00; --orange-l:#FFF1E4;
  --teal:#0F7B7B; --ink:#1E2235; --muted:#4A5170; --line:#D3D8E3; --bg:#EEF1F7; --card:#FFFFFF; --soft:#F4F5F9;
  --ok:#1F7A45; --ok-l:#E6F4EC; --warn-l:#FFF6E0; --err:#B42318; --err-l:#FDECEA; --line-green:#06C755;
}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}
a{color:var(--blue)}
.app{max-width:460px;margin:0 auto;padding:16px}

/* side panels */
.panel{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--line)}
.panel h2{margin:0 0 4px;font-size:15px}
.fab{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--muted);font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(12,26,75,.12)}
@media (max-width:900px){.fab{top:6px;bottom:auto;right:6px;width:36px;padding:0;justify-content:center}.fab span{display:none}.ctl{top:48px;bottom:auto}}
.ctl{position:fixed;right:16px;bottom:60px;z-index:20;width:260px;max-height:calc(100vh - 80px);overflow:auto;padding:12px;font-size:13px;box-shadow:0 8px 24px rgba(12,26,75,.18)}
.ctl .persona label{padding:7px 10px;font-size:13px;line-height:18px}
.ctl .btn-reset{height:38px;font-size:13px}
.ctl .jump select{height:38px;font-size:13px}
.panel p.sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
.persona{display:flex;flex-direction:column;gap:8px}
.persona label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;line-height:20px}
.persona label:has(input:checked){border-color:var(--navy);background:#F1F4FB}
.persona input{margin-top:3px;accent-color:var(--navy)}
.persona small{display:block;color:var(--muted);font-size:11px}
.btn-reset{margin-top:12px;width:100%;height:44px;border-radius:22px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;cursor:pointer}
.jump{margin-top:16px}
.jump select{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);padding:0 10px;background:#fff}
/* phone */
.phone-wrap{position:sticky;top:16px}
.phone{width:100%;max-width:430px;margin:0 auto;height:calc(100vh - 32px);min-height:640px;background:#fff;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
@media (max-width:500px){.app{padding:0}.phone{height:100vh;min-height:0;border:0}}
.phone{position:relative}
.modal{position:absolute;inset:0;z-index:5;background:rgba(12,26,75,.45);display:flex;align-items:flex-end}
.xbtn{position:absolute;left:12px;top:12px;width:36px;height:36px;border:0;border-radius:18px;background:#F0F2F7;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal .sheet{position:relative;width:100%;box-sizing:border-box;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 16px;display:flex;flex-direction:column;gap:10px}
.greet{font-size:20px;font-weight:700}
.mcard{position:relative;overflow:hidden;border-radius:16px;padding:14px 16px 12px;background:#FFF6EC;color:var(--navy);display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.mcard::before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#FFD9B0 0 55%,transparent 56%)}
.mcard::after{content:"";position:absolute;right:30px;top:-70px;width:60px;height:180px;background:#FFE7CF;transform:rotate(28deg)}
.mcard>*{position:relative;z-index:1}
.mtop{display:flex;justify-content:space-between;align-items:center}
.mbrand{font-size:13px;color:#B84E00}.mbrand b{font-weight:700}
.mtype{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:10px;background:var(--navy);color:#fff}
.mname{font-size:13px;letter-spacing:.6px;color:#4A5170;margin-top:6px}
.mpts{display:flex;align-items:baseline;gap:6px}
.mnum{font-size:34px;font-weight:700;line-height:1.15;color:#E0610A}.munit{font-size:14px;font-weight:600}
.mmeter{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding-top:8px;border-top:1px dashed #E9C9A6;font-size:12.5px;color:#3B3F52}
.mmeter b{color:#137A3B}
.dots{display:flex;gap:4px;align-items:center}.dots i{flex:1;max-width:28px;height:6px;border-radius:3px;background:#EAD9C6}.dots i.on{background:#1E9E52}.dots em{font-style:normal;font-size:11px;font-weight:700;color:#137A3B}
.lp{gap:22px}
.lp-sec{display:flex;flex-direction:column;gap:10px}
.lp-sec h2{margin:0;font-size:19px;color:var(--navy)}
.lp-lead{margin:0;font-size:15px;line-height:1.65;color:#3B3F52}
.lp-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp-list li{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;border:1px solid #E6E9F0}
.lp-list b{font-size:14.5px;color:var(--navy)}.lp-list span{font-size:12.5px;color:#5A6075;line-height:1.5}
.lp-steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
.lp-steps li{counter-increment:s;display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;border:1px solid #E6E9F0}
.lp-steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:14px;background:var(--orange);color:var(--navy);font-weight:700;display:flex;align-items:center;justify-content:center}
.lp-cov{background:#fff;border:1px solid #E6E9F0;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.lp-cov>b{font-size:15px;color:var(--navy);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.lp-cov .row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-top:1px dashed #E6E9F0}
.lp-cov .row b{white-space:nowrap;color:var(--navy)}
.ptabs{display:flex;gap:6px;padding:10px 16px 0;background:var(--soft)}
.ptabs button{flex:1;border:1.5px solid #D3D8E3;background:#fff;border-radius:12px;padding:9px 6px;font:inherit;font-size:13px;font-weight:600;color:#4A5170;cursor:pointer}
.ptabs button[aria-selected=true]{border-color:var(--orange);background:#FFF6EC;color:var(--navy)}
.lp-sum{margin:0;font-size:15.5px;line-height:1.6;font-weight:600;color:var(--navy)}
.lp-date{font-size:12.5px;color:#8A90A3}
.lp-h3{margin:4px 0 0;font-size:15px;color:#3B3F52}
.lp-note{margin:0;font-size:12.5px;color:#5A6075;line-height:1.55}
.lp-num{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6;color:#3B3F52}
.lp-num li::marker{color:var(--orange);font-weight:700}
.lp-num a{color:var(--navy);font-weight:600}
.lp-dots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55;color:#3B3F52}
.lp details{background:#fff;border-radius:12px;border:1px solid #E6E9F0;padding:12px 14px}
.lp summary{font-weight:600;font-size:14.5px;cursor:pointer;color:var(--navy)}
.lp details p{margin:8px 0 0;font-size:14px;line-height:1.55;color:#3B3F52}
.site-foot{background:#F3F4F7;border-top:1px solid #E6E9F0;padding:22px 16px 18px;text-align:center;display:flex;flex-direction:column;gap:8px}
.sf-logos{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-bottom:6px}
.sf-logos>div{display:flex;flex-direction:column;align-items:center;gap:8px}
.sf-lbl{font-size:12px;color:#5A6075}
.sf-op{display:inline-block;background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-size:17px;letter-spacing:.2px}.sf-op b{color:var(--orange)}
.sf-ins{font-size:18px;white-space:nowrap;font-weight:700;color:var(--navy);line-height:40px}
.site-foot p{margin:0}
.sf-co{font-size:13.5px;color:#3B3F52}
.sf-lic{font-size:12.5px;color:#8A90A3;line-height:1.6}
.sf-links{font-size:13px;color:#3B3F52}.sf-links a{color:var(--navy);font-weight:600}
.footer.lp-cta{position:sticky;bottom:0;flex-direction:row;align-items:center;gap:12px;box-shadow:0 -4px 14px rgba(12,26,75,.08)}
.footer.lp-cta .btn{flex:1;width:auto}
.callbtn{width:52px;height:52px;flex:none;border-radius:26px;background:var(--orange);display:flex;align-items:center;justify-content:center}
.callbtn svg{stroke:var(--navy)}
/* ===== Landing (V41 pattern, Rabbit colors) ===== */
.wl{--pp:var(--navy);--pp-soft:#EEF1F8;--cta:var(--orange);--cta-d:#E06F10;--mut:#4A4E57;--sub:#6B7280;background:#F7F7F8;color:#111214;min-height:100%;display:flex;flex-direction:column}
.tl-nav{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(0,0,0,.08);height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tl-brand{font-size:16px;font-weight:700;white-space:nowrap}.tl-brand b{color:var(--pp)}.tl-brand span{color:#9CA3AF;font-weight:400;margin:0 3px}.tl-brand i{font-style:normal;color:var(--cta)}
.tl-btn-red{background:var(--cta);color:var(--navy);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.tl-hero{background:#fff;border-bottom:1px solid rgba(0,0,0,.08);padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px}
.tl-line{font-size:11.5px;font-weight:700;color:#06A045;background:#E8F7EE;border-radius:999px;padding:4px 10px}
.tl-crumb .dot{width:8px;height:8px;border-radius:4px;background:#06C755;align-self:center}
.tl-crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px;color:var(--sub)}.tl-crumb b{color:#111214;font-weight:600}
.tl-hero-visual{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(135deg,#071033 0%,#0C1A4B 55%,#24398A 100%);color:#fff;padding:20px;display:flex;flex-direction:column;min-height:260px}
.tl-hero-visual .bg-lines{position:absolute;inset:0;width:100%;height:100%;opacity:.2;pointer-events:none}
.tl-hv-top{position:relative;display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;color:rgba(255,255,255,.92)}
.tl-hv-top span:first-child{font-size:13.5px;color:#fff}
.tl-hv-mid{position:relative;margin:20px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.tl-hv-title{margin:0;font-size:23px;font-weight:700;line-height:1.3}.tl-hv-sub{margin:6px 0 0;font-size:13.5px;color:rgba(255,255,255,.9)}
.tl-pts-card{flex:none;width:104px;min-height:146px;border-radius:16px;background:#FFF6EC;color:var(--navy);border:2px solid rgba(245,130,32,.75);padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;box-shadow:0 16px 32px rgba(0,0,0,.35)}
.tl-pts-card small{font-size:10.5px;font-weight:700;background:var(--navy);color:#fff;border-radius:8px;padding:1px 8px}
.tl-pts-card b{font-size:24px;line-height:1.2;color:#E0610A}.tl-pts-card span{font-size:12px;font-weight:600;line-height:1.3}
.tl-pts-card em{font-style:normal;font-size:10.5px;color:#137A3B;font-weight:600;margin-top:4px;line-height:1.3}
.tl-pts-card b.p{width:48px;height:48px;border-radius:24px;background:var(--cta);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:6px}
.tl-hv-foot{position:relative;margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:rgba(255,255,255,.85)}.tl-hv-foot b{color:var(--cta)}
.tl-kicker{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--pp)}
.tl-h1{margin:0;font-size:25px;font-weight:700;line-height:1.3;color:#111214}
.tl-lead{margin:12px 0 0;font-size:15px;line-height:1.65;color:var(--mut)}
.tl-date{margin:10px 0 0;font-size:12px;color:var(--sub)}
.tl-hero-cta{margin-top:18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.tl-btn-cta-lg{background:var(--cta);color:var(--navy);border:0;border-radius:10px;padding:13px 22px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer}
.tl-btn-outline{background:#fff;color:var(--pp);border:1px solid rgba(12,26,75,.35);border-radius:10px;padding:12px 16px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.tl-main{padding:20px 16px 28px;display:flex;flex-direction:column;gap:16px}
.tl-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:20px}
.tl-card h2{margin:0;font-size:19px;font-weight:700}
.tl-intro{margin:0;font-size:14.5px;line-height:1.65}
.tl-intro-bar{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;font-size:14px}
.tl-link-btn{background:none;border:0;padding:0;color:var(--pp);font:inherit;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.tl-sub{margin:6px 0 0;font-size:13.5px;color:var(--mut);line-height:1.55}
.tl-cov-grid{margin-top:16px;display:grid;gap:10px}
.tl-cov-item{background:#F8F9FA;border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.tl-cov-ico{width:36px;height:36px;flex:none;border-radius:8px;background:var(--pp-soft);border:1px solid rgba(12,26,75,.15);color:var(--pp);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.tl-cov-item b{display:block;font-size:14px;line-height:1.35}.tl-cov-item span{display:block;margin-top:4px;font-size:12.5px;color:var(--mut);line-height:1.5}
.tl-note{margin:16px 0 0;padding-top:12px;border-top:1px solid rgba(0,0,0,.06);font-size:12px;color:var(--sub);line-height:1.55}
.tl-num-list{margin:12px 0 0;padding:0;list-style:none}
.tl-num-list li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:14px;line-height:1.6;color:var(--mut)}
.tl-num-list li:last-child{border-bottom:0;padding-bottom:0}
.tl-num{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--pp);padding-top:3px;flex:none}.tl-num.dark{color:#111214}
.tl-h3{margin:0;font-size:18px}.tl-small{margin:6px 0 0;font-size:12.5px;color:var(--mut);line-height:1.55}
.tl-side-list{margin:12px 0 0;padding:12px 0 0;border-top:1px solid rgba(0,0,0,.06);list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.tl-side-list li::before{content:"✓ ";color:var(--cta);font-weight:700}
.tl-btn-full-red{width:100%;margin-top:14px;background:var(--cta);color:var(--navy);border:0;border-radius:10px;padding:13px 16px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer}
.tl-have{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.06);text-align:center}.tl-have p{margin:0 0 8px;font-size:12px;color:var(--mut)}
.tl-btn-full-gray{width:100%;background:var(--pp-soft);color:var(--pp);border:0;border-radius:10px;padding:11px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tl-contact{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}.tl-contact b{display:block;font-size:13px}.tl-contact span{font-size:12px;color:var(--mut)}
.tl-mobile-call{width:44px;height:44px;border-radius:10px;border:1px solid rgba(0,0,0,.12);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none;color:var(--navy)}
.tl-footer{background:var(--navy);color:#fff;padding:28px 16px 90px}
.tl-ft-top{display:flex;flex-direction:column;gap:12px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.18)}
.tl-by{display:flex;gap:28px;font-size:15px}.tl-by span{display:block;font-size:11px;color:rgba(255,255,255,.7)}.tl-by .tl-jm{color:#FFB066}
.tl-co{margin:0;font-size:12.5px;font-weight:600}
.tl-ft-links{display:flex;flex-wrap:wrap;gap:8px 18px}.tl-ft-links button{background:none;border:0;padding:0;font:inherit;font-size:12px;color:rgba(255,255,255,.9);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.tl-ft-legal{margin-top:16px;font-size:11.5px;color:rgba(255,255,255,.72);line-height:1.7}.tl-ft-legal p{margin:2px 0}
.tl-mobile-bar{position:sticky;bottom:0;z-index:4;background:rgba(255,255,255,.97);border-top:1px solid rgba(0,0,0,.08);padding:10px 16px;margin-top:-71px;transform:translateY(110%);transition:transform .25s ease}
.tl-mobile-bar.on{transform:none}.tl-mobile-bar .tl-btn-full-red{margin-top:0}
/* ===== Landing (V41 mobile pattern, Rabbit style) ===== */
.ra{--ro:#F7941D;--ro-d:#E0610A;--ry:#FFC629;--rink:#3A2614;background:#fff;color:#2B2B33;font-size:14.5px;line-height:1.65;min-height:100%;display:flex;flex-direction:column}
.ra-nav{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:var(--ro);color:#fff;padding:10px 16px}
.ra-brand{font-size:17px;font-weight:700;letter-spacing:-.2px;line-height:1}.ra-brand b{font-weight:700;color:#fff;border-bottom:2px solid #fff}
.ra-x{opacity:.8}.ra-jm{font-size:13px;font-weight:600}
.ra-line{margin-left:auto;background:#fff;color:#06A045;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.ra-body{padding:14px 18px 22px}
.ra-crumb{font-size:11.5px;color:#9A8F84}
.ra-hello{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.ra-ava{width:42px;height:42px;border-radius:21px;background:#FFF1DE;color:var(--ro-d);border:2px solid var(--ro);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none}
.ra-hello div{display:flex;flex-direction:column;line-height:1.25}.ra-hello small{font-size:12px;color:#9A8F84}.ra-hello b{font-size:19px;color:var(--rink)}
.ra-cat{margin:10px 0 2px;color:var(--ro-d);font-size:12px;font-weight:700}
.ra-t{margin:0;color:var(--ro-d);font-size:23px;line-height:1.35;font-weight:700}
.ra-lead{margin:10px 0 6px;color:#4A3F35;font-size:15px}
.ra-date{font-size:12px;color:#9A8F84;margin-bottom:14px}
.ra-ban{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(140deg,#FFD25C 0%,#FFB13B 45%,#F7941D 100%);display:flex;min-height:196px;margin:4px 0 14px}
.ra-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.ra-dot.d1{width:150px;height:150px;right:-40px;top:-50px}.ra-dot.d2{width:70px;height:70px;left:44%;bottom:-28px;background:rgba(255,255,255,.22)}.ra-dot.d3{width:22px;height:22px;left:52%;top:18px;background:rgba(255,255,255,.5)}
.ra-bl{position:relative;flex:1.25;padding:16px 0 16px 16px;display:flex;flex-direction:column;gap:6px}
.ra-chip{align-self:flex-start;background:#fff;color:var(--ro-d);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700}
.ra-bl b{font-size:24px;line-height:1.2;color:#fff;text-shadow:0 1px 0 rgba(176,80,0,.25)}
.ra-bs{font-size:12.5px;color:var(--rink);font-weight:600}

 <div class="hr"></div><div class="row"><span>วิธีชำระ</span><b>${S.pay==='points'&&isMember()?'ตัดพอยต์อัตโนมัติ':'ชำระด้วยเงิน'}</b></div>

 <div class="alert info">${ICON.info}<span>เปลี่ยนเบอร์มือถือในบัญชี Rabbit ต้องติดต่อ Rabbit Call Center หรือจุดบริการ</span></div></div>`};

 <span class="time">10.00 น.</span></div><div class="line-input">พิมพ์ข้อความ</div>`};

/* ---------- engine ---------- */
let cur='line';
function go(id){cur=id;S.trail.push(SC[id].name.split(' · ')[1]);if(S.trail.length>12)S.trail.shift();render()}
function render(){const s=SC[cur];const el=document.getElementById('screen');el.innerHTML=s.html();el.scrollTop=0;
 document.getElementById('jumpSel').value=cur;
 document.getElementById('webbar').classList.toggle('hide',cur==='line'||cur==='line2');
 const f=el.querySelector('button,input,a');s.after&&s.after();}
function fmtPhone(p){p=(p||'').replace(/\D/g,'');return p.length===10?p.slice(0,3)+'-'+p.slice(3,6)+'-'+p.slice(6):p}
function restart(){S=fresh();document.getElementById('fabLabel').textContent='ทดลองเป็น: '+PERSONAS[S.persona].label;cur='line';S.trail=[SC.line.name.split(' · ')[1]];render()}
function jump(id){if(!id)return;if(!S.acc&&['details','hoponly','notme','deduct','lowpts','line2'].includes(id)){const p=P();S.acc={points:p.points||1240,emp:!!p.emp,fname:p.fname,lname:p.lname}}
 if(!S.phone)S.phone=P().phone;if(['summary','deduct','lowpts','success','mypolicy','cash'].includes(id)&&!S.insured)S.insured=who_();go(id)}
/* init */
document.getElementById('personas').innerHTML=Object.entries(PERSONAS).map(([k,v],i)=>`<label><input type="radio" name="p" value="${k}" ${i===0?'checked':''} onchange="restart()"><span>${v.label}<small>${v.desc}</small></span></label>`).join('');
window.toggleCtl=()=>{const c=document.getElementById('ctl'),f=document.getElementById('fab');c.hidden=!c.hidden;f.setAttribute('aria-expanded',String(!c.hidden))};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('ctl').hidden=true;document.getElementById('fab').setAttribute('aria-expanded','false')}});
document.getElementById('jumpSel').innerHTML=Object.entries(SC).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
restart();
</script>
