<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>V46 มือถือ · Exclusive Insurance</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #8a5f0c;
        --red2: #5b3e08;
        --rs: #f8f0d8;
        --gold: #e2b44c;
        --gs: #fff4cf;
        --ink: #17140f;
        --mut: #6a6458;
        --line: #d9d5ca;
        --bg: #eef0f3;
        --pg: #c9cbd1;
        --sf: #fff;
        --ok: #157a3c;
        --os: #eaf4ec;
        --bad: #c0262d;
        --es: #fbe8e8;
        --c1: #fff;
        --c2: #f0f1f4;
        --pa: #f3f4f6;
        --pb: #d3d5db;
        --gm: linear-gradient(
          135deg,
          #fbebb0 0%,
          #e5b947 35%,
          #a97a17 70%,
          #efd17a 100%
        );
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Noto Sans Thai", sans-serif;
        background: var(--pg);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 16px;
        font-size: 14px;
      }
      h3,
      .p,
      .btn {
        font-family: Prompt, "Noto Sans Thai", sans-serif;
      }
      button {
        font: inherit;
        border: 0;
        cursor: pointer;
        color: inherit;
      }
      .ph {
        position: relative;
        width: 390px;
        height: min(844px, 100%);
        background: var(--sf);
        border-radius: 0;
        overflow: hidden;
        box-shadow: 0 24px 60px #0003;
        border: 1px solid var(--line);
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .h {
        background: linear-gradient(160deg, var(--red), var(--red2));
        color: #fff;
        padding: 16px 20px 26px;
        border-radius: 0;
        flex: none;
      }
      .h.dk {
        background: linear-gradient(160deg, #4a383b, #2b2123);
      }
      .h.ok {
        background: linear-gradient(160deg, #22a05a, #146b38);
      }
      .hr {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .hr img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid #fff;
        object-fit: cover;
      }
      .hr em {
        margin-left: auto;
        font-style: normal;
        background: #ffffff2e;
        padding: 4px 12px;
        border-radius: 99px;
        font-weight: 600;
        font-size: 12px;
      }
      .pg {
        display: flex;
        gap: 5px;
        margin-bottom: 14px;
      }
      .pg i {
        flex: 1;
        height: 5px;
        border-radius: 9px;
        background: #ffffff4d;
      }
      .pg i.d {
        background: #fff;
      }
      .pg i.n {
        background: var(--gold);
      }
      .h h3 {
        font-size: 22px;
        line-height: 1.3;
        font-weight: 600;
      }
      .h .s {
        font-size: 13.5px;
        opacity: 0.92;
        margin-top: 4px;
        line-height: 1.5;
      }
      .bd {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ft {
        flex: none;
        padding: 12px 20px 20px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 10px;
        background: var(--sf);
      }
      .btn {
        height: 50px;
        border-radius: 14px;
        background: var(--red);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1.5;
        width: 100%;
        box-shadow: 0 4px 12px #bf2d3b33;
        transition: 0.15s;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.g {
        background: var(--sf);
        color: var(--red);
        border: 1.5px solid var(--red);
        flex: 1;
        box-shadow: none;
      }
      .btn.y {
        background: var(--gold);
        color: #2a1d00;
        box-shadow: none;
        flex: none;
      }
      .btn.dis {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }
      .btn.sm {
        height: 40px;
        font-size: 13px;
        flex: none;
      }
      .card {
        border: 1.5px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
        background: var(--sf);
      }
      .card.rs {
        background: var(--rs);
        border-color: var(--red);
      }
      .card.os {
        background: var(--os);
        border-color: var(--ok);
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 13.5px;
        padding: 5px 0;
      }
      .kv span {
        color: var(--mut);
      }
      .kv b {
        font-weight: 600;
        text-align: right;
      }
      .tot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-top: 1px dashed var(--line);
        margin-top: 6px;
        padding-top: 10px;
      }
      .tot b {
        font-size: 24px;
        color: var(--red);
      }
      .sub {
        font-size: 13px;
        color: var(--mut);
        line-height: 1.55;
      }
      .lbl {
        font-size: 13px;
        font-weight: 600;
      }
      .lnk {
        text-align: center;
        font-size: 13px;
        color: var(--red);
        font-weight: 500;
        cursor: pointer;
        padding: 4px;
      }
      .c {
        text-align: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 99px;
        background: var(--gs);
        color: #9a6200;
        align-self: flex-start;
      }
      .chip.ok {
        background: var(--os);
        color: var(--ok);
      }
      .chip.er {
        background: var(--rs);
        color: var(--red);
      }
      .chip.rd {
        background: var(--red);
        color: #fff;
      }
      .cam {
        flex: 1;
        min-height: 170px;
        border-radius: 18px;
        background: #1e1718;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .fm {
        width: 78%;
        height: 40%;
        border: 2.5px solid var(--gold);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 13px;
      }
      .fm.id {
        height: 56%;
        border-color: #fff;
      }
      .bar {
        width: 84%;
        height: 26px;
        background: repeating-linear-gradient(
          90deg,
          #fff 0 2px,
          #0000 2px 4px,
          #fff 4px 5px,
          #0000 5px 8px
        );
      }
      .ln {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--red);
        box-shadow: 0 0 12px var(--red);
        animation: sc 1.2s ease-in-out infinite alternate;
      }
      @keyframes sc {
        from {
          top: 22%;
        }
        to {
          top: 78%;
        }
      }
      .tip {
        position: absolute;
        bottom: 10px;
        left: 10px;
        right: 10px;
        font-size: 12px;
        color: #fff;
        background: #0009;
        padding: 6px 10px;
        border-radius: 8px;
        text-align: center;
      }
      .two {
        display: flex;
        gap: 10px;
      }
      .opt {
        flex: 1;
        border: 1.5px dashed var(--red);
        background: var(--rs);
        border-radius: 14px;
        padding: 12px 8px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--red);
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: center;
        cursor: pointer;
      }
      .opt i {
        font-style: normal;
        font-size: 24px;
      }
      .opt small {
        font-size: 11px;
        font-weight: 400;
        color: var(--mut);
      }
      .okbox {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 0 2px;
      }
      .tick {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--ok);
        color: #fff;
        font-size: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      @keyframes pop {
        from {
          transform: scale(0);
        }
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 5px;
        padding: 10px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        touch-action: none;
        user-select: none;
      }
      .grid i {
        height: 46px;
        border-radius: 7px;
        background: var(--line);
        transition: 0.12s;
      }
      .grid i.c {
        background: var(--ok);
      }
      .inp {
        width: 100%;
        height: 46px;
        border-radius: 12px;
        border: 1.5px solid var(--line);
        background: var(--bg);
        padding: 0 12px;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
      }
      .inp:focus {
        outline: 0;
        border-color: var(--red);
        background: var(--sf);
      }
      .in2 {
        display: flex;
        gap: 10px;
      }
      .in2 > div {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .seg {
        display: flex;
        background: var(--bg);
        border-radius: 12px;
        padding: 4px;
      }
      .seg button {
        flex: 1;
        height: 36px;
        border-radius: 9px;
        background: none;
        font-weight: 600;
        font-size: 13px;
        color: var(--mut);
      }
      .seg button.on {
        background: var(--sf);
        color: var(--red);
        box-shadow: 0 1px 4px #0002;
      }
      .pm {
        border: 1.5px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .pm.on {
        border-color: var(--red);
        background: var(--rs);
      }
      .pm small {
        display: block;
        font-weight: 400;
        color: var(--mut);
        font-size: 12px;
      }
      .pm .pr {
        margin-left: auto;
        font-family: Prompt;
        color: var(--red);
        font-size: 16px;
        white-space: nowrap;
      }
      .rd {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--line);
        flex: none;
      }
      .on > .rd {
        border: 6px solid var(--red);
      }
      .tag {
        background: #1b8a4b;
        color: #fff;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 99px;
        margin-left: 6px;
        font-weight: 700;
        box-shadow: 0 2px 6px #1b8a4b55;
      }
      .qr {
        width: 160px;
        height: 160px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: conic-gradient(#111 25%, #fff 0 50%, #111 0 75%, #fff 0) 0
          0/16px 16px;
        position: relative;
      }
      .qr::after {
        content: "";
        position: absolute;
        inset: 58px;
        background: var(--red);
        border-radius: 50%;
        border: 5px solid #fff;
      }
      .pol {
        background: linear-gradient(160deg, #1fa35c, #0e6b3a);
        color: #fff;
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pol .chip {
        background: #ffffff33;
        color: #fff;
      }
      .pol b {
        font-size: 16px;
      }
      .pol div {
        font-size: 12px;
        opacity: 0.92;
        margin-top: 3px;
      }
      .bk {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .bk.on {
        border-color: var(--red);
        background: var(--rs);
      }
      .bk u {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .bk s {
        margin-left: auto;
        text-decoration: none;
        color: var(--ok);
      }
      .tl div {
        display: flex;
        gap: 12px;
        padding-bottom: 14px;
        font-size: 13px;
        line-height: 1.4;
      }
      .tl b {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--line);
        color: var(--mut);
        font-size: 12px;
      }
      .tl .d b {
        background: var(--red);
        color: #fff;
      }
      .tl small {
        display: block;
        color: var(--mut);
      }
      .ph3 {
        display: flex;
        gap: 8px;
      }
      .ph3 > * {
        flex: 1;
        height: 68px;
        border: 1.5px dashed var(--red);
        border-radius: 12px;
        background: var(--rs) center/cover;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: var(--red);
        cursor: pointer;
      }
      .pc {
        display: flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
      }
      .act {
        display: grid;
        gap: 10px;
      }
      .act > div {
        display: flex;
        align-items: center;
        gap: 14px;
        border: 1.5px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .act i {
        font-style: normal;
        font-size: 24px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--rs);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .act small {
        display: block;
        font-weight: 400;
        color: var(--mut);
        font-size: 12px;
      }

      .hero {
        padding: 14px 20px 0;
        position: relative;
        overflow: hidden;
        min-height: 214px;
      }
      .hero .sk {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 70px;
        opacity: 0.16;
      }
      .hw {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        position: relative;
      }
      .hw svg {
        flex: none;
        margin-bottom: -4px;
      }
      .big {
        font-family: Prompt;
        font-size: 34px;
        font-weight: 700;
        line-height: 1.1;
        margin: 6px 0 2px;
      }
      .pg2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .pt {
        border: 1.5px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        background: var(--sf);
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }
      .pt .pi {
        height: 88px;
        position: relative;
        overflow: hidden;
      }
      .pt .pi > svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .pt .pi > span {
        position: absolute;
        right: 4px;
        bottom: -16px;
      }
      .pt .bg {
        position: absolute;
        left: 8px;
        top: 8px;
        background: #231f20;
        color: #f2b33d;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 6px;
        z-index: 1;
      }
      .pt > div:last-child {
        padding: 8px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .pt b {
        font-family: Prompt;
        font-size: 13.5px;
        font-weight: 600;
      }
      .pt small {
        font-size: 11.5px;
        color: var(--mut);
      }
      .pt u {
        font-size: 11.5px;
        color: var(--red);
        font-weight: 600;
        text-decoration: none;
        margin-top: 4px;
      }
      .nav {
        flex: none;
        display: flex;
        align-items: flex-end;
        justify-content: space-around;
        border-top: 1px solid var(--line);
        background: var(--sf);
        padding: 8px 12px 12px;
        height: 68px;
      }
      .nav > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 11px;
        font-weight: 600;
        color: var(--mut);
        width: 84px;
        cursor: pointer;
      }
      .nav .on {
        color: var(--red);
      }
      .nav i {
        font-style: normal;
        font-size: 20px;
      }
      .nav .mid {
        margin-top: -28px;
        color: var(--red);
      }
      .nav .mid span {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--red);
        border: 4px solid var(--sf);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px #bf2d3b55;
      }
      .more {
        font-size: 11.5px;
        color: var(--mut);
        text-decoration: underline;
        cursor: pointer;
        margin-left: auto;
      }
      .upl {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #fffffff2;
        color: #231f20;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 12px;
        border-radius: 99px;
        cursor: pointer;
        z-index: 2;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .sbg {
        position: absolute;
        inset: 0;
        background: #0008;
        z-index: 8;
        display: flex;
        align-items: flex-end;
      }
      .sheet {
        width: 100%;
        background: var(--sf);
        border-radius: 20px 20px 0 0;
        padding: 10px 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sheet .hd {
        width: 40px;
        height: 4px;
        border-radius: 9px;
        background: var(--line);
        align-self: center;
      }
      .sr {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        padding: 8px 12px 8px 8px;
        cursor: pointer;
      }
      .sr b {
        font-family: Prompt;
        font-size: 14px;
        font-weight: 600;
      }
      .sr small {
        display: block;
        font-size: 11.5px;
        color: var(--mut);
        line-height: 1.4;
      }
      .sr span {
        margin-left: auto;
        color: var(--red);
        font-size: 22px;
      }
      .sr > div:nth-child(2) {
        flex: 1;
      }
      .si {
        width: 96px;
        height: 52px;
        border-radius: 10px;
        overflow: hidden;
        flex: none;
        position: relative;
      }
      .si svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .tf {
        position: absolute;
        inset: 0;
        z-index: 6;
        background: #fff;
      }
      .tf .grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        grid-template-rows: repeat(20, 1fr);
        gap: 2px;
        padding: 2px;
        border: 0;
        border-radius: 0;
        touch-action: none;
        user-select: none;
      }
      .tf .grid i {
        height: auto;
        border-radius: 4px;
      }
      .hud {
        position: absolute;
        left: 75px;
        top: 34px;
        width: 240px;
        background: #231f20e6;
        color: #fff;
        border-radius: 16px;
        padding: 10px 14px;
        pointer-events: none;
        text-align: center;
        font-size: 12.5px;
      }
      .hud b {
        color: #fff;
        font-size: 15px;
      }
      .hud .kv span {
        color: #ffffffb3;
      }
      .xb {
        position: absolute;
        left: 3px;
        top: 3px;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #231f20;
        color: #fff;
        z-index: 2;
        font-size: 16px;
      }
      .hole {
        position: absolute;
        left: 187px;
        top: 12px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #231f20;
        pointer-events: none;
        z-index: 2;
      }
      .tdone {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        padding: 18px 20px 22px;

      /* ===== V9.27 · The 1 look: black header · red band · black buttons · mono icons ===== */

        --gold: #d13948;
        --gs: #f4f4f4;

        --pa: #f4f4f5;

.lx-k1{background:linear-gradient(90deg,#fff 0%,#ffe27a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.lx-k2{color:#fff}
.lx-k2 b{background:#111;box-shadow:0 0 0 1.5px #ffffff55}
.lx-box{border:0;box-shadow:0 14px 30px #14141466}
.lx-box .bh{background:linear-gradient(90deg,#e3202a,#d53f4e)}
.lx-box .bb b{background:linear-gradient(90deg,#e3202a,#d53f4e);-webkit-background-clip:text;background-clip:text;color:transparent}
.lx-cta{background:var(--cta);box-shadow:0 8px 18px #e3202a66;border:2px solid #fff}
#lxb stop:nth-child(1){stop-color:#ffc08a}#lxb stop:nth-child(2){stop-color:#d53f4e}#lxb stop:nth-child(3){stop-color:#b3121a}
#lxsh stop:nth-child(1){stop-color:#ffb347}#lxsh stop:nth-child(2){stop-color:#e3202a}
#lxg stop{stop-color:#da626e}
.lx-crk path{stroke:#e3202a}
.lx-art ellipse{fill:#141414;opacity:.35}
.lx-hl{box-shadow:0 12px 30px #3838381f}
.lx-hl div+div{border-left-color:#f2eaeb}
.lx-intro b{color:var(--rd)}
.lx-card{border-color:#f2eaeb;box-shadow:0 4px 18px #3838380d}
.lx-h::before{background:linear-gradient(#d53f4e,#e3202a)}
.lx-reg{background:var(--hd);box-shadow:0 10px 22px #38383840}
.lx-reg u{color:var(--rd)}
.lx-cv li{border-top-color:#f2eaeb}
.lx-q li{background:#faf7f7}
.lx-q li span{color:var(--pb7);box-shadow:0 2px 8px #a3263326}
.lx-ol li{border-top-color:#f4efef}
.lx-ol li::before{background:var(--pb1);color:var(--pb7)}
.lx-ol u,.lx-have u{color:var(--pb6)}
.la-bar{border-top-color:#f2eaeb}
.la-bar .la-go{background:var(--cta) !important}
.la-bar .la-fab{color:var(--pb7);border-color:#f0cdd0}
.lx-k2{line-height:1.35}.lx-x2{font-style:normal;display:inline-block;margin-left:2px;font:800 26px/1 Prompt,sans-serif;background:linear-gradient(90deg,#ffe27a,#d53f4e);-webkit-background-clip:text;background-clip:text;color:transparent;vertical-align:-2px}
.lx-k1{background:none !important;color:#ffe27a !important;-webkit-text-fill-color:#ffe27a;text-shadow:0 2px 10px rgba(21,21,21,.45)}
.lx-k2{color:#fff;font-size:21px;line-height:1.45;text-shadow:0 2px 8px rgba(21,21,21,.45)}
.lx-k2 b{text-shadow:none}
.lx-x2{background:#ffd23f !important;color:#232323 !important;-webkit-text-fill-color:#232323;font:800 20px/1 Prompt,sans-serif !important;padding:5px 8px 4px;border-radius:8px;margin-left:4px;vertical-align:1px !important;text-shadow:none;box-shadow:0 3px 10px rgba(255,210,63,.45)}

      async function mkPdf(html, name) {
        if (!window.html2canvas || !window.jspdf)
          return toast("โหลดตัวสร้าง PDF ไม่ได้ · ตรวจสอบอินเทอร์เน็ต");
        toast("กำลังสร้างไฟล์ PDF…");
        const w = document.createElement("div");
        w.className = "a4w";
        w.innerHTML = html;
        document.body.appendChild(w);
        try {
          await document.fonts.ready;
          const el = w.firstElementChild,
            PH = 1123;
          el.style.minHeight = Math.ceil(el.offsetHeight / PH) * PH + "px";
          const cv = await html2canvas(el, {
              scale: 2,
              backgroundColor: "#fff",
              useCORS: true,
              windowWidth: 794,
            }),
            pdf = new jspdf.jsPDF({ unit: "pt", format: "a4" }),
            W = pdf.internal.pageSize.getWidth(),
            ph = Math.round((cv.width * 1123) / 794);
          for (let o = 0, k = 0; o < cv.height; o += ph, k++) {
            const c = document.createElement("canvas");
            c.width = cv.width;
            c.height = Math.min(ph, cv.height - o);
            c.getContext("2d").drawImage(
              cv,
              0,
              o,
              cv.width,
              c.height,
              0,
              0,
              cv.width,
              c.height,
            );
            if (k) pdf.addPage();
            pdf.addImage(
              c.toDataURL("image/jpeg", 0.95),
              "JPEG",
              0,
              0,
              W,
              (c.height * W) / cv.width,
            );
          }
          pdf.save(name);
          toast("✓ บันทึกไฟล์ " + name + " แล้ว");
        } catch (e) {
          console.error(e);
          toast("สร้าง PDF ไม่สำเร็จ");
        } finally {
          w.remove();
        }
      }

    const r = _addr.apply(this, arguments);
    let b = r[1];
    b = b.replace(/(<input[^>]*data-m="cpick"[^>]*?) type=date>/, '$1 type=date min="' + fd + '">');
    b = b.replace(/(<div class=lbl>ช่วงเวลา<\/div><div[^>]*>)[\s\S]*?<\/div>/, (m, open) =>
      open + SLOTS.map((t) => slotOk(S.cpick, t)
        ? `<span class="chip ${S.cslot == t ? "rd" : "er"}" style="cursor:pointer" data-a=slot data-v="${t}">${t}</span>`
        : `<span class="chip er" style="opacity:.4;text-decoration:line-through;cursor:not-allowed" data-a=slotx>${t}</span>`).join("") + "</div>" +
      `<div class=v47-hint>นัดรับได้เฉพาะ <b>วันทำการ (จันทร์–ศุกร์)</b> และต้องนัดล่วงหน้าอย่างน้อย <b>${PICK_LEAD_H} ชม.</b> นับจากเวลาที่กดแจ้งนัดรับ<br>เร็วที่สุดที่เลือกได้: <b>${thDate(fd)} · ${ft}</b></div>`);
    return [r[0], b, r[2]];
  };
  const _addn = A.addn;
  A.addn = function () {
    if (!pickValid() || !slotOk(S.cpick, S.cslot)) {
      fixPick();
      render();
      return toast("วันนัดรับต้องเป็นวันทำการ และล่วงหน้าอย่างน้อย " + PICK_LEAD_H + " ชม. · ปรับเป็นวันที่ใกล้ที่สุดให้แล้ว");
    }
    return _addn.apply(this, arguments);
  };
  const _submit = A.submit;
  A.submit = function () {
    if (S.ship == "home" && S.cpick && !(pickValid() && slotOk(S.cpick, S.cslot))) {
      fixPick();
      go("addr");
      return toast("เวลานัดรับเปลี่ยนไปแล้ว · กรุณาเลือกวัน-เวลานัดรับใหม่");
    }
    return _submit.apply(this, arguments);
  };
  A.slotx = () => toast("ช่วงเวลานี้เลือกไม่ได้ · ต้องนัดล่วงหน้าอย่างน้อย " + PICK_LEAD_H + " ชม.");
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!el.dataset || el.dataset.m != "cpick" || !el.value) return;
    S.cpick = el.value;
    if (isWk(parse(el.value))) {
      const nx = parse(el.value); nx.setDate(nx.getDate() + (nx.getDay() == 6 ? 2 : 1));
      S.cpick = iso(nx);
      fixPick();
      toast("วันเสาร์–อาทิตย์ไม่รับเครื่อง · เลื่อนเป็น " + thDate(S.cpick));
    } else if (!pickValid()) {
      fixPick();
      toast("ต้องนัดล่วงหน้าอย่างน้อย " + PICK_LEAD_H + " ชม. · เลื่อนเป็น " + thDate(S.cpick));
    } else fixPick();
    render();
  });

  /* ---------- 1.1 ลูกค้าปฏิเสธการซ่อม (เห็นค่าส่วนแรกแล้วแพงเกินไป) ---------- */
  const DECWHY = ["ค่าส่วนแรกสูงเกินไป", "จะซ่อมเองที่อื่น", "ไม่ต้องการซ่อมแล้ว", "อื่น ๆ"];
  const DECCARD = () =>
    `<div class="card v47-dec"><b class=p style="font-size:13px">เห็นค่าส่วนแรกแล้วไม่สะดวกซ่อม?</b><div class=sub style="color:var(--ink)">คุณเลือกไม่ซ่อมได้ ไม่มีการเรียกเก็บค่าส่วนแรก และเคลมนี้จะถูกปิด</div>${btn("ไม่ต้องการซ่อม (ปฏิเสธการซ่อม)", "go", "g sm", "decl")}</div>`;

  SC.decl = function () {
    S.hb = "Exclusive Insurance";
    const c = FINc(), f = FIN(c), p = own(c.pol) || { model: c.pol };
    if (c.dec)
      return [
        hdr("ปิดเรื่องเคลมแล้ว", c.id + " · " + p.model, 0, "ปิดเรื่อง", "dk"),
        okbox("รับทราบว่าไม่ซ่อม", "ไม่มีการเรียกเก็บค่าส่วนแรก · ศูนย์ซ่อมหยุดดำเนินการและจัดส่งเครื่องคืนตามที่อยู่ที่แจ้งไว้") +
          `<div class=card>${kv("เลขที่เคลม", c.id)}${kv("วันที่แจ้งไม่ซ่อม", dt(c.dec.at) + " · " + tm(c.dec.at))}${kv("เหตุผล", c.dec.why || "-")}${kv("ค่าใช้จ่าย", fm(0))}</div>`,
        ftr(btn("กลับหน้าแรก", "go", "g", "home"), btn("ติดต่อเจ้าหน้าที่", "go", "", "help")),
      ];
    return [
      hdr("ไม่ต้องการซ่อม", c.id + " · " + p.model, 0, "ปฏิเสธการซ่อม"),
      `<div class=card>${kv(f.rep ? "มูลค่าเครื่องทดแทน" : "ค่าซ่อมตามใบเสนอราคา", fm(f.total))}${kv("ประกันจ่ายให้", `<span style="color:var(--ok)">${fm(f.pay)}</span>`)}<div class=tot><span>ค่าส่วนแรกที่ต้องชำระ</span><b class=p>${fm(f.due)}</b></div></div>` +
        `<div class=lbl>เหตุผล (ไม่บังคับ)</div><div style="display:flex;gap:6px;flex-wrap:wrap">${DECWHY.map((w) => `<span class="chip ${S.decwhy == w ? "rd" : "er"}" style="cursor:pointer" data-a=decwhy data-v="${w}">${w}</span>`).join("")}</div>` +
        `<div class="card rs"><b class=p style="font-size:13px;color:var(--red)">ถ้ายืนยันไม่ซ่อม</b><div class=sub style="color:var(--ink);line-height:1.8">• ไม่มีการเรียกเก็บค่าส่วนแรก และไม่มีค่าใช้จ่ายในเคลมนี้<br>• ศูนย์ซ่อมหยุดดำเนินการ และส่งเครื่องคืนตามที่อยู่ที่แจ้งไว้<br>• เคลมนี้จะถูกปิด ไม่สามารถกลับมาซ่อมต่อในเคลมเดิมได้</div></div>` +
        `<div class=pcl data-a=decok><span class="pcb${S.decok ? " on" : ""}">${S.decok ? "✓" : ""}</span><div>ฉันเข้าใจและยืนยันที่จะไม่ซ่อมเครื่องในเคลมนี้ <b style="color:var(--red)">*</b></div></div>`,
      ftr(btn("กลับไปพิจารณา", "back", "g", "ded"), btn("ยืนยันไม่ซ่อม", "decgo", S.decok ? "" : "dis")),
    ];
  };
  Object.assign(A, {
    decwhy(v) { S.decwhy = S.decwhy == v ? "" : v; render(); },
    decok() { S.decok = !S.decok; render(); },
    decgo() {
      if (!S.decok) return toast("ติ๊กยืนยันก่อน");
      const c = FINc();
      c.dec = { at: +new Date(), why: S.decwhy || "" };
      S.decok = 0; S.decwhy = "";
      toast("ปิดเรื่องเคลมแล้ว · ไม่มีการเรียกเก็บค่าส่วนแรก");
      render();
    },
  });
  // ห้ามเลื่อนสถานะเคลมที่ปฏิเสธซ่อมแล้ว
  const _adv = A.adv;
  A.adv = function () { const c = S.claim || claims[0]; if (c && c.dec) return toast("ลูกค้าปฏิเสธการซ่อม · เคลมปิดแล้ว"); return _adv.apply(this, arguments); };

  const _cfin = SC.cfin;
  SC.cfin = function () {
    const c = S.claim || claims[1];
    if (c.dec) return SC.decl();
    const r = _cfin.apply(this, arguments);
    if (c.stage >= 3 && !c.paid) r[1] += DECCARD();
    if (c.paid) r[1] += `<div class=sub>ใบเสร็จรับเงินส่งทางอีเมลและ SMS แล้ว</div>` + btn("⬇ ใบเสร็จรับเงิน (PDF)", "rcdl", "y sm", c.id);
    return r;
  };
  const _cs = SC.cs;
  SC.cs = function () {
    const c = S.claim;
    if (!c || !c.dec) return _cs.apply(this, arguments);
    const p = own(c.pol);
    return [
      hdr("สถานะเคลม", c.id + " · " + c.pol, 0, "เช็กสถานะ", "dk"),
      `<span class="chip er">ปิดเรื่อง · ลูกค้าปฏิเสธการซ่อม</span><div class="card rs"><b class=p style="color:var(--red);font-size:13px">เคลมนี้ปิดแล้ว</b><div class=sub style="color:var(--ink)">ลูกค้าแจ้งไม่ซ่อมเมื่อ ${dt(c.dec.at)} · ไม่มีการเรียกเก็บค่าส่วนแรก</div></div><div class=card>${kv("เครื่อง", p ? p.model : "-")}${kv("ลักษณะความเสียหาย", c.type)}${kv("เหตุผลที่ไม่ซ่อม", c.dec.why || "-")}${kv("วันที่ยื่น", dt(c.when))}</div>`,
      ftr(btn("ย้อนกลับ", "back", "g", S.csf ? "hub" : "lk"), btn("กลับหน้าแรก", "go", "", "home")),
    ];
  };

  /* ---------- 1.3 ใบเสร็จรับเงินค่าส่วนแรก: ออกทันทีหลังชำระ ส่งทางอีเมล + SMS และดาวน์โหลด PDF ---------- */
  const rcNo = (c) => "RC-" + c.id.replace(/\D/g, "").slice(-8) + "-" + (c.q2 ? "2" : "1");
  const sendTo = () => {
    const em = S.email || "อีเมลที่ลงทะเบียน", ph = S.phone || (S.acct ? tel(S.acct) : "เบอร์ที่ลงทะเบียน");
    return [em, ph];
  };
  const RCDOC = (c) => {
    const p = own(c.pol) || {}, amt = c.rcAmt != null ? c.rcAmt : FIN(c).ded, at = c.rcAt || +new Date();
    return dcWrap(
      "ใบเสร็จรับเงิน", "เลขที่ " + rcNo(c), "ชำระแล้ว", "",
      dcSec("ผู้ชำระเงิน", dcRow("ชื่อ-นามสกุล", "สมชาย ใจดี") + dcRow("เบอร์โทรศัพท์", tel(p.phone || ""))) +
        dcSec("รายการ", dcRow("รายการ", "ค่าเสียหายส่วนแรก") + dcRow("เลขที่เคลม", c.id) + dcRow("กรมธรรม์", c.pol) + dcRow("ทรัพย์สินที่เอาประกัน", p.model || "-")) +
        dcSec("การชำระเงิน", dcRow("ช่องทาง", c.payM == 1 ? "บัตรเครดิต / เดบิต" : "PromptPay QR") + dcRow("วัน-เวลาที่ชำระ", dt(at) + " · " + tm(at)) + dcRow("เลขอ้างอิง", c.payRef || "-")) +
        dcM("ยอดที่ชำระแล้ว", fm(amt)),
    );
  };
  const _p2do = A.p2do;
  A.p2do = function (v) {
    if (/^paid=/.test(v)) {
      const cc = FINc();
      if (!cc.paid) { cc.rcAmt = FIN(cc).due; cc.rcAt = +new Date(); cc.payM = P2().m ?? 0; }
    }
    return _p2do.apply(this, arguments);
  };
  const _ded = SC.ded;
  SC.ded = function () {
    const c = FINc();
    if (c.dec) return SC.decl();
    const r = _ded.apply(this, arguments);
    let [h, b, f] = r;
    if (P2().paid || c.paid) {
      const [em, ph] = sendTo();
      b += `<div class="card v47-rc"><b class=p style="font-size:14px">🧾 ใบเสร็จรับเงิน</b>${kv("เลขที่ใบเสร็จ", rcNo(c))}${kv("ยอดที่ชำระ", fm(c.rcAmt != null ? c.rcAmt : FIN(c).ded))}<div class=sub style="color:var(--ink);margin-top:6px">ระบบออกใบเสร็จให้อัตโนมัติทันทีหลังชำระ และส่งให้ 2 ทาง<br>• อีเมล <b>${em}</b> (แนบไฟล์ PDF)<br>• SMS <b>${ph}</b> (ลิงก์ดาวน์โหลด)<br>ดาวน์โหลดซ้ำได้จากหน้า "สรุปการเงินเคลม"</div><div class=two style="margin-top:10px">${btn("⬇ ดาวน์โหลด PDF", "rcdl", "sm", c.id)}${btn("ส่งอีกครั้ง", "rcmail", "g sm", c.id)}</div></div>`;
    } else {
      b = b.replace("<div class=lbl>ช่องทางชำระ</div>", DECCARD() + "<div class=lbl>ช่องทางชำระ</div>");
      b += `<div class=sub style="text-align:center">ชำระแล้วได้รับ <b>ใบเสร็จรับเงิน</b> ทางอีเมลและ SMS ทันที</div>`;
    }
    return [h, b, f];
  };
  Object.assign(A, {
    rcdl(v) { const c = claims.find((x) => x.id == v) || FINc(); mkPdf(RCDOC(c), "Receipt_" + rcNo(c) + ".pdf"); },
    rcmail(v) { const [em, ph] = sendTo(); toast("ส่งใบเสร็จไปที่ " + em + " และ SMS " + ph + " แล้ว"); },
  });

  /* ---------- 1.4 ติ๊กขอรับเอกสารทางไปรษณีย์ (ก่อนชำระเงิน) + 1.5 LINE หน้าสุดท้าย ---------- */
  const _done = SC.done;
  SC.done = function () {
    const r = _done.apply(this, arguments);
    const P = S.pd || {};
    let add = "";
    if (P.post)
      add += `<div class="card v47-post"><b class=p style="font-size:14px">📮 จัดส่งเอกสารทางไปรษณีย์</b><div class=sub style="color:var(--ink)">เราจะจัดส่งเอกสารกรมธรรม์ฉบับกระดาษไปที่<br><b>${S.kacur || S.kaid || "ที่อยู่ปัจจุบันที่กรอกไว้"}</b><br>นอกจากนี้ยังส่งสำเนาทางอีเมลและ SMS ตามปกติ</div></div>`;
    add += `<div class="card v47-line"><div class=lr><span class=li>LINE</span><div><b class=p style="font-size:14px">เพิ่มเพื่อน LINE สำหรับงานเคลม</b><div class=sub style="color:var(--ink)">แจ้งเคลม ติดตามสถานะ และคุยกับเจ้าหน้าที่ได้อีกช่องทาง</div></div></div><a class=lb href="${LINE_URL}" target="_blank" rel="noopener noreferrer">เพิ่มเพื่อนใน LINE</a></div>`;
    r[1] += add;
    return r;
  };

  render();
})();
</script>
</body>
</html>
